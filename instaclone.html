<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Instagram</title>
</head>

<body class="bg-white">

    <main class="min-h-screen grid grid-rows-[1fr_auto]">

        <!-- CONTEÚDO -->
        <section class="grid grid-cols-2 items-center justify-center max-w-[900px] w-full mx-auto">

            <!-- IMAGEM -->
            <div class="flex justify-center">
                <img
                    src="./img/celulares.png"
                    alt="Instagram"
                    class="w-[450px]"
                >
            </div>

            <!-- LOGIN -->
            <div class="w-[350px]">

                <!-- Caixa de login -->
                <div class="border border-gray-300 px-10 py-8">

                    <h1 class="text-center text-4xl font-serif italic mb-8">
                        Instagram
                    </h1>

                    <form class="grid gap-2">

                        <input
                            type="text"
                            placeholder="Número de Telefone, e-mail"
                            class="h-10 border border-gray-400 px-2 text-xs"
                        >

                        <input
                            type="password"
                            placeholder="Senha"
                            class="h-10 border border-gray-400 px-2 text-xs"
                        >

                        <button
                            class="h-10 mt-2 bg-blue-500 text-white rounded-md
                                   text-sm font-semibold hover:bg-blue-600"
                        >
                            Entrar
                        </button>

                    </form>

                    <!-- OU -->
                    <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3 my-5">

                        <div class="h-px bg-gray-300"></div>

                        <span class="text-xs font-semibold text-gray-500">
                            OU
                        </span>

                        <div class="h-px bg-gray-300"></div>

                    </div>

                    <button class="w-full text-sm font-semibold text-blue-700 mb-5">
                        Logar com o Facebook
                    </button>

                    <a
                        href="#"
                        class="block text-center text-xs text-blue-700"
                    >
                        Esqueci minha senha
                    </a>

                </div>

                <!-- CADASTRO -->
                <div class="border border-gray-300 mt-4 h-16 grid place-items-center text-sm">

                    <p>
                        Não tem conta ?
                        <a href="#" class="text-blue-500 font-semibold">
                            Cadastrar-se
                        </a>
                    </p>

                </div>

                <!-- APLICATIVO -->
                <div class="text-center mt-6">

                    <p class="text-sm mb-4">
                        Baixe o Aplicativo
                    </p>

                    <div class="grid grid-cols-2 gap-2 justify-items-center">

                        <img
                            src="./img/appstore.png"
                            class="h-10"
                            alt="App Store"
                        >

                        <img
                            src="./img/googleplay.png"
                            class="h-10"
                            alt="Google Play"
                        >

                    </div>

                </div>

            </div>

        </section>


        <!-- RODAPÉ -->
        <footer class="pb-8 text-center text-xs text-gray-500">

            <div class="flex flex-wrap justify-center gap-4 mb-5">

                <a href="#">Meta</a>
                <a href="#">About</a>
                <a href="#">Blog</a>
                <a href="#">Jobs</a>
                <a href="#">Help</a>
                <a href="#">API</a>
                <a href="#">Privacy</a>
                <a href="#">Locations</a>
                <a href="#">Instagram Lite</a>
                <a href="#">Contact uploading and non-users</a>
                <a href="#">Meu Verified</a>

            </div>

            <div class="flex justify-center gap-4">

                <span>Português (Brasil)</span>
                <span>© 2026 Instagram for senai</span>

            </div>

        </footer>

    </main>

</body>
</html>
