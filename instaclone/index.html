<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>InstaClone</title>
</head>
<body>
    <section class="grid grid-cols-2">
        <div class="flex justify-end items-center">
            <img src="./img/insta-img.png" alt="" class=" max-h-200">
        </div>
        <div class="flex flex-col items-center mr-50">
            <div class="h-100 w-80 border-1 border-black rounded-sm flex flex-col items-center mt-30 flex-s">
                <img src="./img/insta-logo.png" alt="" class="w-52 mt-5">
                <form class="grid grid-rows-2 gap-5">
                    <input type="text" placeholder="Número de Telefone, e-mail" class="w-60 bg-sky-50 text-sm border rounded-sm p-2 px-3 border-gray-500">
                    <input type="text" placeholder="Senha" class="w-60 text-sm bg-sky-50 border rounded-sm p-2 px-3 border-gray-500">
                    <button class="w-60 bg-blue-400 p-1 rounded-md text-white">Entrar</button>
                </form>
                <div class="flex flex-col items-center">
                    <a href="" class="font-bold text-blue-600 mb-5 mt-7">Logar com Facebook</a>
                    <a href="" class="text-blue-600 text-sm">Esqueci minha senha</a>
                </div>
            </div> 
            <div class="border-1 border-black w-80 flex justify-center items-center my-5 py-4 gap-2">
                <p>Não tem conta ?</p>
                <a href="" class="text-blue-400 font-bold">Cadastre-se</a>
            </div>
            <div class="flex flex-col items-center mt-5">
                <p>Baixe o aplicativo</p>
                <div class="flex flex-row max-w gap-5 mt-5">
                    <img src="./img/apple.png" alt="" class="max-h-10">
                    <img src="./img/google.png" alt="" class="max-h-10">
                </div>
            </div>
        </div>
    </section>
    <footer class="flex flex-col">
        <div class="flex justify-center gap-15 text-base">
            <a href="#">Meta</a>
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Jobs</a>
            <a href="#">Help</a>
            <a href="#">API</a>
            <a href="#">Privacy</a>
            <a href="#">Locations</a>
            <a href="#">Instaclone Lite</a>
            <a href="#">Contact uploading and non-users</a>
            <a href="#">Meu Verified</a>
        </div>
        <div class="flex justify-center py-5 gap-5 text-base">
            <p class="">Português (Brasil)</p>
            <p class="">© 2026 Instaclone for senai</p>
        </div>
    </footer>

</body>
</html>
